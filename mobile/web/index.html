<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Веб-сборка мобильного приложения: на iPhone открывается в Safari и добавляется «На экран Домой» -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Заказ судовых запчастей со склада АО «НСРЗ»">
  <meta name="theme-color" content="#B4532A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="НСРЗ">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>НСРЗ · Запчасти</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FAF5EE; }
    /* заставка, пока загружается приложение (важно на медленном канале) */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
            font: 600 18px -apple-system, 'Segoe UI', Roboto, sans-serif; color: #2F2620; transition: opacity .3s; }
    #boot img { width: 76px; height: 76px; border-radius: 20px; animation: pulse 1.2s ease-in-out infinite alternate; }
    #boot small { font-weight: 500; color: #9A8B7E; font-size: 13px; }
    @keyframes pulse { from { transform: scale(.94); } to { transform: scale(1.04); } }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt=""><span>НСРЗ · Запчасти</span><small>Загружаем приложение…</small></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot'); b.style.opacity = 0; setTimeout(function () { b.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
